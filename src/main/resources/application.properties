# Application
spring.application.name=bookvault

# H2 Database
spring.datasource.url=jdbc:h2:file:C:/Users/Hp/test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ? This makes data.sql run AFTER Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true

# SQL Init
spring.sql.init.mode=always

# JWT
jwt.secret=bookvault-super-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# Scheduling
spring.task.scheduling.pool.size=2

# Logging
logging.level.com.bookvault=DEBUG